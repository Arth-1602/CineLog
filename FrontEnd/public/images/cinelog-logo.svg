<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gold-grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FCE5B0" />
      <stop offset="45%" stop-color="#D6A65D" />
      <stop offset="80%" stop-color="#AA7B30" />
      <stop offset="100%" stop-color="#F4D38E" />
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#D6A65D" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Film Reel Rim -->
  <circle cx="50" cy="46" r="40" stroke="url(#gold-grad)" stroke-width="3.5" filter="url(#gold-glow)" />
  <circle cx="50" cy="46" r="37" stroke="url(#gold-grad)" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Center Hub -->
  <circle cx="50" cy="46" r="11" stroke="url(#gold-grad)" stroke-width="3" />
  <circle cx="50" cy="46" r="6" fill="url(#gold-grad)" />

  <!-- Radial Film Reel Apertures / Circles -->
  <!-- Top -->
  <circle cx="50" cy="22" r="6" stroke="url(#gold-grad)" stroke-width="2.5" />
  <!-- Bottom -->
  <circle cx="50" cy="70" r="6" stroke="url(#gold-grad)" stroke-width="2.5" />
  <!-- Left -->
  <circle cx="26" cy="46" r="6" stroke="url(#gold-grad)" stroke-width="2.5" />
  <!-- Right -->
  <circle cx="74" cy="46" r="6" stroke="url(#gold-grad)" stroke-width="2.5" />
  <!-- Diagonal upper right -->
  <circle cx="67" cy="29" r="4.5" stroke="url(#gold-grad)" stroke-width="2" />
  <!-- Diagonal lower right -->
  <circle cx="67" cy="63" r="4.5" stroke="url(#gold-grad)" stroke-width="2" />
  <!-- Diagonal lower left -->
  <circle cx="33" cy="63" r="4.5" stroke="url(#gold-grad)" stroke-width="2" />
  <!-- Diagonal upper left -->
  <circle cx="33" cy="29" r="4.5" stroke="url(#gold-grad)" stroke-width="2" />

  <!-- Trailing Film Strip Leader -->
  <path d="M 50 86 L 85 86" stroke="url(#gold-grad)" stroke-width="3.5" stroke-linecap="round" />
  <line x1="85" y1="83" x2="85" y2="89" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round" />
</svg>
